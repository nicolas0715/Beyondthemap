
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond the Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #a9d6ed;
        }

        .leaflet-container {
            background: #a9d6ed;
        }

        #debug-console {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: black;
            color: white;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            z-index: 9999;
            padding: 10px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="debug-console"></div>

<!-- SISTEMA DE DEPURACIÓN -->
<script>
    const logDiv = document.getElementById('debug-console');

    function appendLog(type, args) {
        const line = document.createElement('div');

        line.style.borderBottom = '1px solid #444';
        line.style.padding = '4px 0';
        line.style.whiteSpace = 'pre-wrap';
        line.style.overflowWrap = 'anywhere';

        const message = Array.from(args).map(value => {
            if (value instanceof Error) {
                return value.stack || value.message;
            }

            if (typeof value === 'object' && value !== null) {
                try {
                    return JSON.stringify(value, null, 2);
                } catch (e) {
                    return String(value);
                }
            }

            return String(value);
        }).join(' ');

        line.textContent = type + ': ' + message;

        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    ['log', 'warn', 'error'].forEach(type => {
        const original = console[type];

        console[type] = function(...args) {
            original.apply(console, args);
            appendLog(type.toUpperCase(), args);
        };
    });

    window.onerror = function(msg, url, line, column, error) {
        appendLog('JAVASCRIPT ERROR', [
            msg,
            'Línea: ' + line,
            'Columna: ' + column,
            error || ''
        ]);
    };

    window.addEventListener('unhandledrejection', event => {
        console.error('Error en promesa:', event.reason);
    });

    console.log('Sistema de depuración iniciado.');
</script>

<!-- LIBRERÍAS -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
    
<script src="https://cdn.jsdelivr.net/npm/exifreader@4.25.0/dist/exif-reader.js"></script>

<script>

    // =====================================
    // 1. VERIFICAR LIBRERÍAS
    // =====================================

    if (typeof window.L === 'undefined') {
        console.error('ERROR: Leaflet no se pudo cargar.');
        throw new Error('Leaflet L no está definido.');
    }

    console.log('Leaflet cargado correctamente:', window.L.version);

    // =====================================
// CONVERSIÓN DE COORDENADAS EXIF
// =====================================

function rationalToNumber(value) {

    if (typeof value === 'number') {
        return value;
    }

    if (Array.isArray(value)) {
        return Number(value[0]) / Number(value[1]);
    }

    if (typeof value === 'object' && value !== null) {

        if ('numerator' in value && 'denominator' in value) {
            return value.numerator / value.denominator;
        }
    }

    return Number(value);
}


function getGPSCoordinate(tag, reference) {

    if (!tag) return null;

    let decimal = null;

    // Intentar leer los valores originales EXIF

    if (Array.isArray(tag.value) && tag.value.length >= 3) {

        const degrees = rationalToNumber(tag.value[0]);
        const minutes = rationalToNumber(tag.value[1]);
        const seconds = rationalToNumber(tag.value[2]);

        if (
            Number.isFinite(degrees) &&
            Number.isFinite(minutes) &&
            Number.isFinite(seconds)
        ) {

            decimal = Math.abs(degrees) +
                      minutes / 60 +
                      seconds / 3600;
        }
    }

    // Si no hay valores originales, leer la descripción

    if (decimal === null) {

        const description = String(
            tag.description || tag.value || ''
        );

        const numbers = description.match(/-?\d+(?:\.\d+)?/g);

        if (!numbers) return null;

        if (numbers.length >= 3) {

            decimal = Math.abs(Number(numbers[0])) +
                      Number(numbers[1]) / 60 +
                      Number(numbers[2]) / 3600;

        } else {

            decimal = Number(numbers[0]);
        }
    }

    if (!Number.isFinite(decimal)) return null;

    // Aplicar orientación geográfica

    const direction = String(
        reference?.description || reference?.value || ''
    ).trim().toUpperCase();

    if (direction.startsWith('S') || direction.startsWith('W')) {
        decimal = -decimal;
    }

    return decimal;
}

    
    if (typeof window.ExifReader === 'undefined') {
        console.error('ERROR: ExifReader no se pudo cargar.');
        throw new Error('ExifReader no está definido.');
    }

    console.log('ExifReader cargado correctamente.');

    // =====================================
    // 2. INICIALIZAR MAPA
    // =====================================

    const map = window.L.map('map', {
        center: [20, 0],
        zoom: 2,
        minZoom: 2,
        maxZoom: 10,
        worldCopyJump: true,
        zoomControl: true
    });

    // =====================================
// SISTEMA DE COLORES DE PAÍSES
// =====================================

const baseColor = '#f4f5f5';

const availableColors = [
    '#e74c3c', // Rojo
    '#f1c40f', // Amarillo
    '#2ecc71', // Verde
    '#5dade2', // Celeste
    '#e67e22'  // Naranja
];

let countriesLayer = null;

let countryFeatures = [];

const countriesWithPhotos = new Set();

const countryColors = new Map();

function getCountryStyle(feature) {

    const id = feature.__countryId;

    return {
        fillColor: countryColors.get(id) || baseColor,
        fillOpacity: 1,
        color: '#a0aab0',
        weight: 0.8
    };
}
// =====================================
// 3. CARGAR PAÍSES
// =====================================

const countriesReady = fetch(
    'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson'
)

.then(response => {

    if (!response.ok) {
        throw new Error(
            'Error descargando fronteras: ' + response.status
        );
    }

    return response.json();

})

.then(data => {

    // Asignar identificador a cada país

    data.features.forEach((feature, index) => {
        feature.__countryId = index;
    });

    countryFeatures = data.features;

    countriesLayer = window.L.geoJSON(data, {

        style: getCountryStyle,

        onEachFeature: function(feature, layer) {

            const name =
                feature.properties.ADMIN ||
                feature.properties.name ||
                'País desconocido';

            layer.bindPopup(
                '<strong>' + name + '</strong>'
            );

            layer.on('mouseover', function() {

                layer.setStyle({
                    fillColor: '#d6e8f2',
                    weight: 1.5
                });

                layer.bringToFront();
            });

            layer.on('mouseout', function() {

                layer.setStyle(
                    getCountryStyle(feature)
                );

            });

        }

    }).addTo(map);

    map.fitBounds(countriesLayer.getBounds());

    console.log('Países cargados correctamente.');

})

.catch(error => {

    console.error('Error cargando países:', error);

    throw error;

});


// =====================================
// 4. IDENTIFICAR PAÍSES CON FOTOGRAFÍAS
// =====================================

function identifyCountry(latitude, longitude) {

    const point = turf.point([
        longitude,
        latitude
    ]);

    for (const feature of countryFeatures) {

        try {

            if (
                turf.booleanPointInPolygon(
                    point,
                    feature
                )
            ) {

                const id = feature.__countryId;

                countriesWithPhotos.add(id);

                console.log(
                    'Fotografía ubicada en:',
                    feature.properties.ADMIN
                );

                return id;
            }

        } catch (error) {

            console.warn(
                'Error identificando país:',
                error
            );

        }

    }

    console.warn(
        'No se encontró un país para:',
        latitude,
        longitude
    );

    return null;
}

    // =====================================
// 5. COLOREAR PAÍSES
// =====================================

function colorCountries() {

    console.log('Iniciando coloreado de países...');

    const activeCountries = countryFeatures.filter(
        feature =>
            countriesWithPhotos.has(feature.__countryId)
    );

    // Crear conexiones entre países vecinos

    const neighbors = new Map();

    activeCountries.forEach(feature => {

        neighbors.set(
            feature.__countryId,
            new Set()
        );

    });

    // Comprobar fronteras compartidas

    for (let i = 0; i < activeCountries.length; i++) {

        for (let j = i + 1; j < activeCountries.length; j++) {

            const countryA = activeCountries[i];
            const countryB = activeCountries[j];

            try {

                const touching = turf.booleanTouches(
                    countryA,
                    countryB
                );

                if (touching) {

                    const idA = countryA.__countryId;
                    const idB = countryB.__countryId;

                    neighbors.get(idA).add(idB);
                    neighbors.get(idB).add(idA);

                }

            } catch (error) {

                console.warn(
                    'Error comprobando fronteras:',
                    error
                );

            }

        }

    }

    // Mezclar aleatoriamente los colores

    function shuffle(array) {

        const result = [...array];

        for (let i = result.length - 1; i > 0; i--) {

            const j = Math.floor(
                Math.random() * (i + 1)
            );

            [result[i], result[j]] =
                [result[j], result[i]];

        }

        return result;
    }

    // Algoritmo de coloreado con backtracking

    const assignments = new Map();

    function assignColors() {

        if (assignments.size === activeCountries.length) {
            return true;
        }

        // Elegir el país con más vecinos ya coloreados

        let selected = null;
        let maxSaturation = -1;
        let maxDegree = -1;

        for (const feature of activeCountries) {

            const id = feature.__countryId;

            if (assignments.has(id)) continue;

            const adjacent = neighbors.get(id);

            const saturation = new Set(
                [...adjacent].map(
                    neighborId => assignments.get(neighborId)
                ).filter(Boolean)
            ).size;

            const degree = adjacent.size;

            if (
                saturation > maxSaturation ||
                (
                    saturation === maxSaturation &&
                    degree > maxDegree
                )
            ) {

                selected = feature;
                maxSaturation = saturation;
                maxDegree = degree;

            }

        }

        const selectedId = selected.__countryId;

        // Obtener colores utilizados por sus vecinos

        const forbiddenColors = new Set(
            [...neighbors.get(selectedId)].map(
                id => assignments.get(id)
            ).filter(Boolean)
        );

        // Probar colores disponibles en orden aleatorio

        const available = shuffle(
            availableColors.filter(
                color => !forbiddenColors.has(color)
            )
        );

        for (const color of available) {

            assignments.set(selectedId, color);

            if (assignColors()) {
                return true;
            }

            assignments.delete(selectedId);

        }

        return false;
    }

    const success = assignColors();

    if (!success) {

        console.error(
            'No se pudo encontrar una combinación de colores.'
        );

        return;
    }

    // Guardar y aplicar los colores

    countryColors.clear();

    assignments.forEach((color, id) => {

        countryColors.set(id, color);

    });

    countriesLayer.eachLayer(layer => {

        layer.setStyle(
            getCountryStyle(layer.feature)
        );

    });

    console.log(
        'Países coloreados correctamente:',
        assignments.size
    );

    activeCountries.forEach(feature => {

        const id = feature.__countryId;

        console.log(
            feature.properties.ADMIN,
            '=>',
            assignments.get(id)
        );

    });

}


    // =====================================
    // 4. FOTOGRAFÍAS
    // =====================================

    const photos = [
        "Images/DJI_0036.JPG",
        "Images/DJI_0073.JPG",
        "Images/DJI_0274.JPG",
        "Images/DJI_0329.JPG",
        "Images/DJI_0480.JPG",
        "Images/DJI_0746.JPG",
        "Images/DJI_0932.JPG",
        ];


    // =====================================
    // 5. LEER METADATOS GPS
    // =====================================

    async function loadPhotosOnMap() {

        console.log('Iniciando carga de fotografías...');

        await countriesReady;

        for (const photo of photos) {

            try {

                console.log('Procesando:', photo);

                const response = await fetch(photo);

                if (!response.ok) {
                    throw new Error(
                        'No se pudo descargar la fotografía: ' + response.status
                    );
                }

                const buffer = await response.arrayBuffer();

                console.log('Imagen descargada:', photo);



const tags = ExifReader.load(buffer);

console.log('CAMPOS DE UBICACIÓN:', {
    GPSLatitude: tags.GPSLatitude,
    GPSLongitude: tags.GPSLongitude,
    Location: tags.Location,
    Creator: tags.Creator,
    Autor: tags.Autor,
});


console.log('Metadatos EXIF:', tags);

let latitude = null;
let longitude = null;

// GPS EXIF estándar

if (tags.GPSLatitude && tags.GPSLongitude) {

    latitude = getGPSCoordinate(
        tags.GPSLatitude,
        tags.GPSLatitudeRef
    );

    longitude = getGPSCoordinate(
        tags.GPSLongitude,
        tags.GPSLongitudeRef
    );

    console.log('GPS EXIF detectado.');

}

// GPS XMP de DJI como alternativa

else {

    const rawLat =
        tags['drone-dji:GpsLatitude'] ||
        tags.GpsLatitude;

    const rawLon =
        tags['drone-dji:GpsLongitude'] ||
        tags.GpsLongitude;

    if (rawLat && rawLon) {

        latitude = parseFloat(
            rawLat.description || rawLat.value || rawLat
        );

        longitude = parseFloat(
            rawLon.description || rawLon.value || rawLon
        );

        console.log('GPS DJI encontrado.');
    }
}

// Validar coordenadas

if (
    latitude === null ||
    longitude === null ||
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude) ||
    Math.abs(latitude) > 90 ||
    Math.abs(longitude) > 180
) {

    console.warn(
        'Coordenadas GPS inválidas:',
        latitude,
        longitude
    );

    continue;
}

// Mostrar coordenadas finales

console.log('==============================');
console.log('FOTOGRAFÍA:', photo);
console.log('LATITUD FINAL:', latitude);
console.log('LONGITUD FINAL:', longitude);
console.log('==============================');

                // =====================================
                // 6. CREAR MARCADOR
                // =====================================

                if (typeof window.L === 'undefined') {
                    throw new Error('Leaflet dejó de estar disponible.');
                }

                const marker = window.L.marker([
                    latitude,
                    longitude
                ]).addTo(map);

// Identificar el país del marcador

identifyCountry(latitude, longitude);

                // =====================================
                // 7. POPUP CON FOTOGRAFÍA
                // =====================================

                marker.bindPopup(`
                    <div style="width:220px">

                        <img
                            src="${photo}"
                            style="width:100%; border-radius:8px; display:block;"
                        >

                        <p style="
                            margin-top:8px;
                            font-family:sans-serif;
                            font-size:12px;
                        ">
                            ${photo.split('/').pop()}
                        </p>

                    </div>
                `);

                console.log(
                    'MARCADOR CREADO:',
                    latitude,
                    longitude
                );

            }

            catch (error) {

                console.error(
                    'Error procesando la foto:',
                    photo,
                    error
                );

            }
        }
        colorCountries();
    }


    // =====================================
    // 8. INICIAR PROCESAMIENTO
    // =====================================

    loadPhotosOnMap();

</script>

</body>
</html>
