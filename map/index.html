
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #a9d6ed;
        }

        .leaflet-container {
            background: #a9d6ed;
        }

        #uploadPanel {
            position: absolute;
            top: 15px;
            left: 60px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 10px #0003;
            max-width: calc(100% - 85px);
        }

        #uploadPanel button {
            padding: 9px 14px;
            background: #267ca5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #status {
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="uploadPanel">
    <button onclick="document.getElementById('photoInput').click()">
        Seleccionar fotografías
    </button>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        multiple
        hidden
    >

    <div id="status">Esperando fotografías...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

<script>

// INICIALIZAR MAPA

const map = L.map("map", {
    center: [20, 0],
    zoom: 2,
    minZoom: 2,
    maxZoom: 10,
    worldCopyJump: true
});

const countryStyle = {
    fillColor: "#f4f5f5",
    fillOpacity: 1,
    color: "#a0aab0",
    weight: 0.8
};

// CARGAR PAÍSES

fetch("https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson")

.then(response => {
    if (!response.ok) {
        throw new Error("Error cargando países");
    }
    return response.json();
})

.then(data => {

    const countries = L.geoJSON(data, {

        style: countryStyle,

        onEachFeature: function(feature, layer) {

            const name =
                feature.properties.ADMIN ||
                feature.properties.name ||
                "País desconocido";

            layer.bindPopup("<strong>" + name + "</strong>");

            layer.on("mouseover", function() {
                layer.setStyle({
                    fillColor: "#d6e8f2",
                    weight: 1.5
                });
            });

            layer.on("mouseout", function() {
                countries.resetStyle(layer);
            });
        }

    }).addTo(map);

    map.fitBounds(countries.getBounds());

})

.catch(error => {
    console.error("Error cargando mapa:", error);
});


// CARGAR FOTOGRAFÍAS

const photoInput = document.getElementById("photoInput");
const status = document.getElementById("status");

photoInput.addEventListener("change", async function(event) {

    const files = Array.from(event.target.files);

    if (files.length === 0) return;

    status.textContent = "Procesando fotografías...";

    let markersCreated = 0;
    let withoutGPS = 0;
    let errors = 0;

    for (const file of files) {

        try {

            console.log("Procesando:", file.name);

            // Leer archivo local
            const buffer = await file.arrayBuffer();

            // Extraer GPS de los metadatos EXIF
            const gps = await exifr.gps(buffer);

            console.log("GPS encontrado:", gps);

            if (
                !gps ||
                gps.latitude == null ||
                gps.longitude == null
            ) {
                console.warn("Sin GPS:", file.name);
                withoutGPS++;
                continue;
            }

            // Crear URL temporal para mostrar la imagen
            const imageURL = URL.createObjectURL(file);

            // Crear marcador
            const marker = L.marker([
                gps.latitude,
                gps.longitude
            ]).addTo(map);

            // Crear popup
            marker.bindPopup(`
                <div style="width:220px">
                    <img
                        src="${imageURL}"
                        style="
                            width:100%;
                            border-radius:8px;
                            display:block;
                        "
                    >

                    <p style="margin-top:8px">
                        ${file.name}
                    </p>
                </div>
            `);

            markersCreated++;

            console.log(
                "Marcador creado:",
                gps.latitude,
                gps.longitude
            );

        } catch(error) {

            console.error("Error:", file.name, error);
            errors++;
        }
    }

    status.textContent =
        markersCreated + " imágenes ubicadas | " +
        withoutGPS + " sin GPS | " +
        errors + " errores";

    console.log("Proceso terminado.");

    // Permitir seleccionar nuevamente los mismos archivos
    photoInput.value = "";

});

</script>

</body>
</html>
